[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lipas2tak"
version = "0.1.0"
description = "Finnish outdoor recreation data (Lipas, OpenStreetMap) for TAK: CoT data packages, KMZ, KML network links and GPX"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Street3r" }]
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31",
    "PyYAML>=6.0",
    "segno>=1.6",
    "tzdata>=2024.1",   # time zones for `schedule --at`, also without system zoneinfo
]

[project.optional-dependencies]
icons = ["Pillow>=10.1"]
dev = ["pytest>=8"]

[project.scripts]
lipas2tak = "lipas2tak.cli:main"

[tool.setuptools.packages.find]
include = ["lipas2tak*"]
