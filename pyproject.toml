[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lipas2tak"
version = "0.1.0"
description = "Lipas-retkeilykohteet TAK-käyttöön: CoT-datapaketit, KMZ, KML-verkkolinkit ja GPX"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
icons = ["Pillow>=10.1"]
dev = ["pytest>=8"]

[project.scripts]
lipas2tak = "lipas2tak.cli:main"

[tool.setuptools.packages.find]
include = ["lipas2tak*"]
