# Short area names for file names and hashtags.
#
# Lipas names are like "Nuuksion kansallispuisto" (Finnish genitive), so the
# base form cannot be derived reliably (Oulangan -> Oulanka).
# Key = the part of the name before "kansallispuisto"/"erämaa-alue".
# For a missing name a fallback rule is used (drop a trailing "n") and a
# warning is logged so the name can be added here.

kansallispuistot:
  "Etelä-Konneveden": Etelä-Konnevesi
  "Helvetinjärven": Helvetinjärvi
  "Hiidenportin": Hiidenportti
  "Hossan": Hossa
  "Isojärven": Isojärvi
  "Itäisen Suomenlahden": Itäinen Suomenlahti
  "Kauhanevan-Pohjankankaan": Kauhaneva-Pohjankangas
  "Kolin": Koli
  "Koloveden": Kolovesi
  "Kurjenrahkan": Kurjenrahka
  "Lauhanvuoren": Lauhanvuori
  "Leivonmäen": Leivonmäki
  "Lemmenjoen": Lemmenjoki
  "Liesjärven": Liesjärvi
  "Linnansaaren": Linnansaari
  "Nuuksion": Nuuksio
  "Oulangan": Oulanka
  "Pallas-Yllästunturin": Pallas-Yllästunturi
  "Patvinsuon": Patvinsuo
  "Perämeren": Perämeri
  "Petkeljärven": Petkeljärvi
  "Puurijärven ja Isonsuon": Puurijärvi-Isosuo
