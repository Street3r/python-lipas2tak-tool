# Feature kinds and their sources, appearance and tags.
#
# Every feature ends up in exactly one kind. Classification goes through the
# kinds in this order and picks the first one with a matching source, so more
# specific rules (e.g. kota by name) come before general ones (laavu = any
# other type 301).
#
# Fields:
#   label:    display name fi/en
#   tag:      hashtag fi/en (without #, a-z0-9 only)
#   group:    KMZ folder / separate per-group KMZ (see groups below)
#   icon:     icon file in the icon set (icons/<set>/<icon>)
#   cot_type: CoT type for markers (points)
#   color:    line colour #RRGGBB (routes)
#   route_method / route_type: ATAK route link_attr values (default Walking / On Foot)
#   sources:
#     lipas:  type_codes + optional name_regex (Python regex, case-insensitive)
#     loi:    Lipas /v2/lois loi-types
#     osm:    OpenStreetMap tags (Overpass), e.g. {amenity: toilets}; a list of
#             dicts = alternatives. Optional context_radius_m / dedupe_radius_m.

groups:
  suojat:          {label: {fi: "Laavut, kodat ja tuvat", en: "Shelters and huts"}}
  tulentekopaikat: {label: {fi: "Nuotio- ja keittopaikat", en: "Campfire sites"}}
  nakotornit:      {label: {fi: "Näkötornit ja näköalapaikat", en: "Towers and viewpoints"}}
  telttailu:       {label: {fi: "Telttailu", en: "Camping"}}
  kaymalat:        {label: {fi: "Käymälät", en: "Toilets"}}
  opasteet:        {label: {fi: "Opasteet ja luontokeskukset", en: "Info points"}}
  muut:            {label: {fi: "Muut palvelut", en: "Other services"}}
  reitit:          {label: {fi: "Reitit", en: "Routes"}}

kinds:
  # --- Shelters -----------------------------------------------------------
  kota:
    label: {fi: Kota, en: Hut (kota)}
    tag: {fi: kota, en: kota}
    group: suojat
    icon: kota.png
    cot_type: a-u-G
    sources:
      lipas: {type_codes: [301], name_regex: "kota|kåta"}
      # OSM supplement: used only if Lipas has no feature of the same group nearby
      osm: {tags: {amenity: shelter, shelter_type: basic_hut}, context_radius_m: 1500, dedupe_radius_m: 120}
  kammi:
    label: {fi: Kammi, en: Turf hut}
    tag: {fi: kammi, en: turfhut}
    group: suojat
    icon: kota.png
    cot_type: a-u-G
    sources:
      lipas: {type_codes: [301], name_regex: "kammi"}
  laavu:
    label: {fi: Laavu, en: Lean-to}
    tag: {fi: laavu, en: leanto}
    group: suojat
    icon: laavu.png
    cot_type: a-u-G
    sources:
      lipas: {type_codes: [301]}
      osm: {tags: {amenity: shelter, shelter_type: lean_to}, context_radius_m: 1500, dedupe_radius_m: 120}
  tupa:
    label: {fi: Tupa, en: Hut}
    tag: {fi: tupa, en: hut}
    group: suojat
    icon: tupa.png
    cot_type: a-u-G
    sources:
      lipas: {type_codes: [302]}
      osm: {tags: {tourism: wilderness_hut}, context_radius_m: 3000, dedupe_radius_m: 150}

  # --- Campfire sites -------------------------------------------------------
  keittokatos:
    label: {fi: Keittokatos, en: Cooking shelter}
    tag: {fi: keittokatos, en: cookingshelter}
    group: tulentekopaikat
    icon: keittokatos.png
    cot_type: a-u-G
    sources:
      lipas: {type_codes: [206], name_regex: "keittokatos|katos"}
      loi: {types: [cooking-shelter]}
      osm: {tags: {amenity: shelter, shelter_type: picnic_shelter}, context_radius_m: 1500, dedupe_radius_m: 80}
  nuotiopaikka:
    label: {fi: Nuotiopaikka, en: Campfire site}
    tag: {fi: nuotiopaikka, en: campfire}
    group: tulentekopaikat
    icon: nuotiopaikka.png
    cot_type: a-u-G
    sources:
      lipas: {type_codes: [206]}
      loi: {types: [fire-pit]}
      osm: {tags: {leisure: firepit}, context_radius_m: 1500, dedupe_radius_m: 60}

  # --- Towers and viewpoints ---------------------------------------------
  nakotorni:
    label: {fi: Näkötorni, en: Observation tower}
    tag: {fi: nakotorni, en: tower}
    group: nakotornit
    icon: nakotorni.png
    cot_type: a-u-G
    sources:
      lipas: {type_codes: [204]}
      loi: {types: [viewing-platform]}
      osm: {tags: {man_made: tower, "tower:type": observation}, context_radius_m: 3000, dedupe_radius_m: 120}
  nakoalapaikka:
    label: {fi: Näköalapaikka, en: Viewpoint}
    tag: {fi: nakoalapaikka, en: viewpoint}
    group: nakotornit
    icon: nakoalapaikka.png
    cot_type: a-u-G
    sources:
      loi: {types: [viewpoint]}
      osm: {tags: {tourism: viewpoint}, context_radius_m: 1000, dedupe_radius_m: 80}

  # --- Camping -----------------------------------------------------------
  telttapaikka:
    label: {fi: Telttapaikka, en: Tent site}
    tag: {fi: telttapaikka, en: tentsite}
    group: telttailu
    icon: telttapaikka.png
    cot_type: a-u-G
    sources:
      lipas: {type_codes: [202]}
      loi: {types: [tent-site, reservation-campsite]}
      osm:
        tags:
          - {tourism: camp_site, backcountry: "yes"}
          - {tourism: camp_site, camp_site: basic}
        context_radius_m: 2000
        dedupe_radius_m: 120

  # --- Toilets -----------------------------------------------------------
  kaymala:
    label: {fi: Käymälä, en: Toilet}
    tag: {fi: kaymala, en: toilet}
    group: kaymalat
    icon: kaymala.png
    cot_type: a-u-G
    sources:
      loi: {types: [dry-toilet, wc]}
      osm: {tags: {amenity: toilets}}

  # --- Info points ---------------------------------------------------------
  luontokeskus:
    label: {fi: Luontokeskus, en: Nature centre}
    tag: {fi: luontokeskus, en: naturecentre}
    group: opasteet
    icon: luontokeskus.png
    cot_type: a-u-G
    sources:
      loi: {types: [nature-centre]}
  opastuspiste:
    label: {fi: Opastuspiste, en: Info point}
    tag: {fi: opastuspiste, en: info}
    group: opasteet
    icon: opastuspiste.png
    cot_type: a-u-G
    sources:
      lipas: {type_codes: [207]}
      loi: {types: [information-board]}

  # --- Other ---------------------------------------------------------------
  puuvaja:
    label: {fi: Puuvaja, en: Woodshed}
    tag: {fi: puuvaja, en: woodshed}
    group: muut
    icon: puuvaja.png
    cot_type: a-u-G
    sources:
      loi: {types: [woodshed]}
  vesipiste:
    label: {fi: Kaivo / vesipiste, en: Well / water}
    tag: {fi: vesipiste, en: water}
    group: muut
    icon: vesipiste.png
    cot_type: a-u-G
    sources:
      loi: {types: [well, water-source]}
      osm:
        tags:
          - {man_made: water_well}
          - {amenity: drinking_water}
        context_radius_m: 500
        dedupe_radius_m: 50
  rantautumispaikka:
    label: {fi: Rantautumispaikka, en: Landing spot}
    tag: {fi: rantautuminen, en: landing}
    group: muut
    icon: rantautumispaikka.png
    cot_type: a-u-G
    sources:
      loi: {types: [landing-spot]}
  pysakointi:
    label: {fi: Pysäköinti, en: Parking}
    tag: {fi: pysakointi, en: parking}
    group: muut
    icon: pysakointi.png
    cot_type: a-u-G
    sources:
      loi: {types: [parking-spot]}

  # --- Routes -------------------------------------------------------------
  # Similar routes share a colour.
  luontopolku:
    label: {fi: Luontopolku, en: Nature trail}
    tag: {fi: luontopolku, en: naturetrail}
    group: reitit
    color: "#2E9E44"
    sources:
      lipas: {type_codes: [4404]}
  retkeilyreitti:
    label: {fi: Retkeilyreitti, en: Hiking trail}
    tag: {fi: vaellus, en: hiking}
    group: reitit
    color: "#D7261E"
    sources:
      lipas: {type_codes: [4405]}
  monikayttoreitti:
    label: {fi: Monikäyttöreitti, en: Multi-use trail}
    tag: {fi: monikaytto, en: multiuse}
    group: reitit
    color: "#E67E22"
    sources:
      lipas: {type_codes: [4406]}
  pyorailyreitti:
    label: {fi: Pyöräilyreitti, en: Cycling route}
    tag: {fi: pyoraily, en: cycling}
    group: reitit
    color: "#8E44AD"
    sources:
      lipas: {type_codes: [4411, 4412]}
  melontareitti:
    label: {fi: Melontareitti, en: Canoe route}
    tag: {fi: melonta, en: paddling}
    group: reitit
    color: "#1F6FD1"
    sources:
      lipas: {type_codes: [4451, 4452]}
  # Walking/outdoor routes (4403) are often neighbourhood exercise routes: disabled by default.
  ulkoilureitti:
    enabled: false
    label: {fi: Ulkoilureitti, en: Outdoor route}
    tag: {fi: ulkoilureitti, en: outdoorroute}
    group: reitit
    color: "#7F8C8D"
    sources:
      lipas: {type_codes: [4403]}
