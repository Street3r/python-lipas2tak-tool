# python-lipas2tak-tool – main settings
# Values can be overridden with environment variables, see README.

languages: [fi, en]

# Public base URL where the KMZ files and data packages are served.
# Used in KML network links (NetworkLink) and on the index.html page.
public_base_url: "https://example.org/lipas2tak"   # env: LIPAS2TAK_PUBLIC_BASE_URL

paths:
  cache: data/cache        # raw data and cache
  output: data/output      # published files (served by nginx)
  # Icon set. Default is the project's own pictogram set. A custom set can be
  # used by setting LIPAS2TAK_ICONS_DIR; missing icons are taken from
  # icons_fallback. See icons/README.md.
  icons: icons/retkeily              # env: LIPAS2TAK_ICONS_DIR
  icons_fallback: icons/retkeily

sources:
  lipas:
    base_url: "https://api.lipas.fi/v2"
    page_size: 100
    statuses: [active, out-of-service-temporarily]
    request_delay_s: 0.3   # politeness delay between requests
    cache_max_age_h: 20    # do not re-fetch the same data within one run
  lois:
    enabled: true
    statuses: [active]
  osm:
    enabled: true
    overpass_url: "https://overpass-api.de/api/interpreter"   # env: LIPAS2TAK_OVERPASS_URL
    # Tried in order when the main server is busy (504/429) or down. If all fail,
    # the previous cached result is used.
    overpass_fallback_urls:
      - "https://overpass.private.coffee/api/interpreter"
      - "https://overpass.kumi.systems/api/interpreter"
    # Default OSM filters (overridable per kind in types.yaml): only features
    # near other outdoor features or routes are included (urban toilets are left out).
    context_radius_m: 300
    # If Lipas/LOI has a feature of the same group this close, the OSM feature is skipped.
    dedupe_radius_m: 40
  regions:
    # Statistics Finland regional boundaries (CC BY 4.0)
    wfs_url: "https://geo.stat.fi/geoserver/tilastointialueet/wfs"
    layer: "tilastointialueet:maakunta1000k"

# Filter out test/erroneous data by name
exclude_name_regex: "(?i)\\btesti|testauskohde|testikohde"

areas:
  # Only areas with enabled: true are produced. The order here is the order of
  # the categories on the share pages and in links/all_<lang>.kml.
  kansallispuistot:
    enabled: true
    lipas_type_codes: [111]
    label: {fi: Kansallispuisto, en: National park}
    title: {fi: Kansallispuistot, en: National parks}
    buffer_m: 500          # include parking and info points at the edge
    strip_from_name: "(?i)\\s*kansallispuisto$"
  eramaat:
    enabled: true
    lipas_type_codes: [110]   # Lipas "Erämaa-alue" (checked 2026-10)
    label: {fi: Erämaa-alue, en: Wilderness area}
    title: {fi: Erämaa-alueet, en: Wilderness areas}
    buffer_m: 500
    strip_from_name: "(?i)\\s*erämaa(-alue)?$"
    exclude_lipas_ids: [616785]   # "Koiraharju": active in type 110 but not a wilderness area (2026-10)
  valtion_retkeilyalueet:
    enabled: true
    lipas_type_codes: [109]   # Lipas "Valtion retkeilyalue" (checked 2026-10)
    label: {fi: Valtion retkeilyalue, en: State hiking area}
    title: {fi: Valtion retkeilyalueet, en: State hiking areas}
    buffer_m: 500
    strip_from_name: "(?i)\\s*(valtion\\s+)?retkeilyalue$"
  maakunnat:
    enabled: true
    title: {fi: Maakunnat, en: Regions}

# Nationwide layers per route type: one KMZ per type, collected in
# links/reitit_<lang>.kml ("All routes"). Kinds from types.yaml; a kind with
# area_packages: false is only here.
route_types:
  enabled: true
  title: {fi: Kaikki reitit, en: All routes}
  # Only KMZ layers and their links (no data packages or GPX for the whole country)
  outputs: {datapackage: false, gpx: false, kmz_per_group: false}
  # A type with subtypes is a folder with one layer per subtype
  types:
    kavely:
      name: {fi: Kävely, en: Walking}
      subtypes:
        luontopolut: {name: {fi: Luontopolut, en: Nature trails}, kinds: [luontopolku]}
        ulkoilureitit: {name: {fi: Ulkoilureitit, en: Outdoor routes}, kinds: [ulkoilureitti]}
    vaellus:
      name: {fi: Vaellus, en: Hiking}
      kinds: [retkeilyreitti]
    monikaytto:
      name: {fi: Monikäyttö, en: Multi-use}
      kinds: [monikayttoreitti]
    pyoraily:
      name: {fi: Pyöräily, en: Cycling}
      subtypes:
        pyorailyreitit: {name: {fi: Pyöräilyreitit, en: Cycling routes}, kinds: [pyorailyreitti]}
        maastopyorailyreitit: {name: {fi: Maastopyöräilyreitit, en: Mountain bike trails}, kinds: [maastopyorailyreitti]}
    moottorikelkkailu:
      name: {fi: Moottorikelkkailu, en: Snowmobiling}
      subtypes:
        moottorikelkkareitit: {name: {fi: Moottorikelkkareitit, en: Snowmobile routes}, kinds: [moottorikelkkareitti]}
        moottorikelkkaurat: {name: {fi: Moottorikelkkaurat, en: Snowmobile trails}, kinds: [moottorikelkkaura]}
    melonta:
      name: {fi: Melonta, en: Paddling}
      subtypes:
        melontareitit: {name: {fi: Melontareitit, en: Canoe routes}, kinds: [melontareitti]}
        vesiretkeilyreitit: {name: {fi: Vesiretkeilyreitit, en: Water routes}, kinds: [vesiretkeilyreitti]}

routes:
  # CoT format: route = navigable ATAK route (b-m-r), shape = drawn line (u-d-f)
  cot_format: route
  simplify_tolerance_m: 5.0   # Douglas–Peucker
  merge_snap_m: 5.0           # joining of route parts
  # At path junctions, pieces are joined into the straightest continuation
  # (turn at most this many degrees), so a network becomes a few long lines
  junction_max_turn_deg: 60
  stroke_weight: 4.0
  # A route part is included in an area (park) package if at least this share
  # of its length, or at least area_min_inside_m metres, lies inside the area.
  area_min_share: 0.3
  area_min_inside_m: 3000
  # Rest stops along routes as named waypoints (ATAK navigation, GPX)
  waypoints:
    enabled: true
    radius_m: 75              # max distance of a feature from the route line
    cluster_m: 200            # features closer than this to each other = one waypoint
    groups: [suojat, tulentekopaikat, telttailu, nakotornit]

remarks:
  max_text_chars: 500         # before hashtags

outputs:
  datapackage: true
  kmz: true
  kmz_per_group: true         # separate KMZ per group (shelters / campfire sites / ...)
  network_link: true          # <area>_<lang>.kml network link next to each KMZ
  network_link_per_group: false  # network links for the per-group KMZ files as well
  # Top-level KML files with network links to all areas:
  # links/all_<lang>.kml (all categories) and links/<category>_<lang>.kml
  root_links: true
  # Whether the areas of a category are switched on by default in those files
  # (route types are not in all_<lang>.kml: the parks and regions contain their routes)
  root_links_visible:
    kansallispuistot: true
    eramaat: true
    valtion_retkeilyalueet: true
    maakunnat: false
    reitit: true
  gpx: true
  # false: imported packages stay in ATAK's Data Packages list (contents can be hidden or
  # removed together); true: ATAK deletes the package file after importing its contents
  datapackage_on_receive_delete: false
  share_pages: true          # share/<lang>/*.html with QR codes (needs public_base_url)
  network_link_refresh_s: 86400
